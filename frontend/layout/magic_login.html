<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Logging you in | AuditQR</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#3185FC" />
    <link rel="stylesheet" href="../design-tokens.css" />
    <link rel="stylesheet" href="../tailwind.css" />
    <script src="../config.js"></script>
    <script src="./toast.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen flex flex-col">
    <nav class="navbar">
      <div class="navbar-content">
        <a href="/" class="navbar-logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 16 16">
            <path d="M0 0h16v16H0z" fill="none" />
            <g fill="#3185FC">
              <path d="M2 2h2v2H2z" />
              <path d="M6 0v6H0V0zM5 1H1v4h4zM4 12H2v2h2z" />
              <path d="M6 10v6H0v-6zm-5 1v4h4v-4zm11-9h2v2h-2z" />
              <path d="M10 0v6h6V0zm5 1v4h-4V1zM8 1V0h1v2H8v2H7V1zm0 5V4h1v2zM6 8V7h1V6h1v2h1V7h5v1h-4v1H7V8zm0 0v1H2V8H1v1H0V7h3v1zm10 1h-1V7h1zm-1 0h-1v2h2v-1h-1zm-4 0h2v1h-1v1h-1zm2 3v-1h-1v1h-1v1H9v1h3v-2zm0 0h3v1h-2v1h-1zm-4-1v1h1v-2H7v1z" />
              <path d="M7 12h1v3h4v1H7zm9 2v2h-3v-1h2v-1z" />
            </g>
          </svg>
          <span>AuditQR</span>
        </a>
      </div>
    </nav>

    <div class="flex-1 flex items-center justify-center">
    <div class="text-center px-6 max-w-sm">
      <h1 class="font-headline text-[28px] font-medium text-white mb-3" id="status-heading">Verifying your account…</h1>
      <p class="font-body text-muted text-[15px] leading-relaxed" id="status-body">Please wait while we confirm your email.</p>
    </div>
    </div>
    <script>
      (async function () {
        const token = new URLSearchParams(window.location.search).get("token");
        if (!token) {
          document.getElementById("status-heading").textContent = "Invalid link";
          document.getElementById("status-body").innerHTML =
            'This link is missing a token. Please check your email and try again.<br><br><a href="login.html" class="text-blue hover:underline">Go to login</a>';
          return;
        }

        try {
          const res = await fetch(API_BASE + "/api/sme/auth/magic?token=" + encodeURIComponent(token));
          const data = await res.json();

          if (res.ok) {
            localStorage.setItem("auditqr_token", data.token);
            localStorage.setItem("auditqr_sme", JSON.stringify(data.sme));
            window.location.href = "dashboard.html";
          } else {
            document.getElementById("status-heading").textContent = "Link expired or already used";
            document.getElementById("status-body").innerHTML =
              '<a href="login.html" class="text-blue hover:underline">Go to login</a>';
          }
        } catch (err) {
          document.getElementById("status-heading").textContent = "Something went wrong";
          document.getElementById("status-body").innerHTML =
            'Network error. <a href="login.html" class="text-blue hover:underline">Go to login</a>';
        }
      })();
    </script>
  </body>
</html>
