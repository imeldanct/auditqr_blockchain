<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login | AuditQR</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#3185FC" />
    <meta
      name="description"
      content="Log in to your AuditQR business account to manage products and track supply chain activity."
    />
    <link rel="stylesheet" href="../design-tokens.css" />
    <link rel="stylesheet" href="../tailwind.css" />
    <script src="../config.js"></script>
    <script src="/layout/toast.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="navbar">
      <div class="navbar-content">
        <a href="/" class="navbar-logo">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 16 16"
          >
            <path d="M0 0h16v16H0z" fill="none" />
            <g fill="#3185FC">
              <path d="M2 2h2v2H2z" />
              <path d="M6 0v6H0V0zM5 1H1v4h4zM4 12H2v2h2z" />
              <path d="M6 10v6H0v-6zm-5 1v4h4v-4zm11-9h2v2h-2z" />
              <path
                d="M10 0v6h6V0zm5 1v4h-4V1zM8 1V0h1v2H8v2H7V1zm0 5V4h1v2zM6 8V7h1V6h1v2h1V7h5v1h-4v1H7V8zm0 0v1H2V8H1v1H0V7h3v1zm10 1h-1V7h1zm-1 0h-1v2h2v-1h-1zm-4 0h2v1h-1v1h-1zm2 3v-1h-1v1h-1v1H9v1h3v-2zm0 0h3v1h-2v1h-1zm-4-1v1h1v-2H7v1z"
              />
              <path d="M7 12h1v3h4v1H7zm9 2v2h-3v-1h2v-1z" />
            </g>
          </svg>
          <span>AuditQR</span>
        </a>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 page-offset pb-20 flex items-center justify-center">
      <div class="w-full max-w-md px-4">
        <!-- Header -->
        <header class="mb-8 text-center">
          <h1 class="font-headline text-[32px] font-medium text-white leading-tight mb-3">
            Welcome back
          </h1>
          <p class="font-body text-[15px] text-muted leading-relaxed">
            Sign in to manage your products and supply chain.
          </p>
        </header>

        <!-- Login Card -->
        <div
          class="bg-surface border border-outline-variant border-t-2 rounded-xl p-6 md:p-8"
          style="border-top-color: #3185fc"
        >
          <form id="login-form" class="space-y-5" novalidate>
            <!-- Email -->
            <div>
              <label class="form-label" for="login-email">Email address</label>
              <input
                class="w-full bg-surface-2 border border-border rounded-lg px-4 py-3 text-[14px] text-white placeholder-muted/50 focus:outline-none focus:border-blue focus:ring-1 focus:ring-blue/30 transition-colors font-body"
                type="email"
                id="login-email"
                placeholder="admin@yourbusiness.com"
                autocomplete="email"
                required
              />
            </div>

            <!-- Password -->
            <div>
              <label class="form-label" for="login-password">Password</label>
              <div class="relative">
                <input
                  class="w-full bg-surface-2 border border-border rounded-lg px-4 py-3 pr-11 text-[14px] text-white placeholder-muted/50 focus:outline-none focus:border-blue focus:ring-1 focus:ring-blue/30 transition-colors font-body"
                  type="password"
                  id="login-password"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  required
                />
                <button
                  type="button"
                  class="absolute right-3 top-1/2 -translate-y-1/2 flex items-center text-muted hover:text-blue transition-colors"
                  id="toggle-password"
                  tabindex="-1"
                >
                  <svg id="pw-eye-open" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" class="text-[20px]" style="display:block;"><path fill="currentColor" d="M15.188 14.688Q16.5 13.375 16.5 11.5t-1.312-3.187T12 7T8.813 8.313T7.5 11.5t1.313 3.188T12 16t3.188-1.312m-5.1-1.276Q9.3 12.625 9.3 11.5t.788-1.912T12 8.8t1.913.788t.787 1.912t-.787 1.913T12 14.2t-1.912-.787m-4.738 3.55Q2.35 14.925 1 11.5q1.35-3.425 4.35-5.462T12 4t6.65 2.038T23 11.5q-1.35 3.425-4.35 5.463T12 19t-6.65-2.037m11.838-1.45Q19.55 14.025 20.8 11.5q-1.25-2.525-3.613-4.012T12 6T6.813 7.488T3.2 11.5q1.25 2.525 3.613 4.013T12 17t5.188-1.487"/></svg>
                  <svg id="pw-eye-closed" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" class="text-[20px]" style="display:none;"><path fill="currentColor" d="m16.1 13.3l-1.45-1.45q.225-1.175-.675-2.2t-2.325-.8L10.2 7.4q.425-.2.863-.3T12 7q1.875 0 3.188 1.313T16.5 11.5q0 .5-.1.938t-.3.862m3.2 3.15l-1.45-1.4q.95-.725 1.688-1.587T20.8 11.5q-1.25-2.525-3.588-4.012T12 6q-.725 0-1.425.1T9.2 6.4L7.65 4.85q1.025-.425 2.1-.638T12 4q3.775 0 6.725 2.087T23 11.5q-.575 1.475-1.513 2.738T19.3 16.45m.5 6.15l-4.2-4.15q-.875.275-1.762.413T12 19q-3.775 0-6.725-2.087T1 11.5q.525-1.325 1.325-2.463T4.15 7L1.4 4.2l1.4-1.4l18.4 18.4zM5.55 8.4q-.725.65-1.325 1.425T3.2 11.5q1.25 2.525 3.588 4.013T12 17q.5 0 .975-.062t.975-.138l-.9-.95q-.275.075-.525.113T12 16q-1.875 0-3.188-1.312T7.5 11.5q0-.275.038-.525t.112-.525zm4.2 4.2"/></svg>
                </button>
              </div>
            </div>

            <!-- Submit -->
            <button
              type="submit"
              id="login-submit-btn"
              class="w-full bg-blue hover:bg-blue-dark text-white font-body font-medium py-3.5 rounded-lg flex justify-center items-center gap-2 transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed mt-2"
            >
              <span id="login-btn-text">Sign in</span>
            </button>
            <p class="text-center text-[13px] text-muted mt-3">
              <a href="forgot_password.html" class="text-blue hover:underline">Forgot password?</a>
            </p>
          </form>
        </div>

        <!-- Footer link -->
        <p class="text-center text-[13px] text-muted mt-8">
          Don't have an account?
          <a href="register.html" class="text-blue hover:underline"
            >Register your business</a
          >
        </p>
      </div>
    </main>

    <div class="glow-blue-center"></div>

    <script>
      // Redirect if already logged in — verify token is still valid before redirecting
      const _existingToken = localStorage.getItem("auditqr_token");
      if (_existingToken) {
        fetch(API_BASE + "/api/sme/profile", {
          headers: { Authorization: "Bearer " + _existingToken }
        }).then(function(r) {
          if (r.ok) {
            window.location.href = "dashboard.html";
          } else {
            localStorage.removeItem("auditqr_token");
          }
        }).catch(function() {
          // Network error — stay on login page
        });
      }

      // Toggle password visibility
      document.getElementById("toggle-password").addEventListener("click", () => {
        const input = document.getElementById("login-password");
        const showing = input.type === "password";
        input.type = showing ? "text" : "password";
        document.getElementById("pw-eye-open").style.display = showing ? "none" : "block";
        document.getElementById("pw-eye-closed").style.display = showing ? "block" : "none";
      });

      // Login form submit
      document
        .getElementById("login-form")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const email = document.getElementById("login-email").value.trim();
          const password = document.getElementById("login-password").value;
          const btn = document.getElementById("login-submit-btn");
          const btnText = document.getElementById("login-btn-text");

          if (!email || !password) {
            showToast("Please enter your email and password.", "error");
            return;
          }

          btn.disabled = true;
          btnText.textContent = "Signing in\u2026";

          try {
            const res = await fetch(`${API_BASE}/api/sme/login`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });

            const data = await res.json();

            if (res.ok) {
              localStorage.setItem("auditqr_token", data.token);
              localStorage.setItem("auditqr_sme", JSON.stringify(data.sme));
              window.location.href = "dashboard.html";
            } else {
              showToast(data.error || "Invalid email or password.", "error");
              btn.disabled = false;
              btnText.textContent = "Sign in";
            }
          } catch (err) {
            showToast("Network error. Is the server running?", "error");
            btn.disabled = false;
            btnText.textContent = "Sign in";
          }
        });
    </script>
  </body>
</html>
