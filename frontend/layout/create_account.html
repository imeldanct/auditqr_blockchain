<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Create Account | AuditQR</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#3185FC" />
    <meta name="description" content="Set up your administrator account for AuditQR." />
    <link rel="stylesheet" href="../design-tokens.css" />
    <link rel="stylesheet" href="../tailwind.css" />
    <script src="../config.js"></script>
    <script src="/layout/toast.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen flex flex-col">
    <!-- Navbar — Logo only (pre-auth) -->
    <nav class="navbar">
      <div class="navbar-content">
        <a href="/" class="navbar-logo" id="nav-logo">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 16 16"
          >
            <path d="M0 0h16v16H0z" fill="none" />
            <g fill="#3185FC">
              <path d="M2 2h2v2H2z" />
              <path d="M6 0v6H0V0zM5 1H1v4h4zM4 12H2v2h2z" />
              <path d="M6 10v6H0v-6zm-5 1v4h4v-4zm11-9h2v2h-2z" />
              <path
                d="M10 0v6h6V0zm5 1v4h-4V1zM8 1V0h1v2H8v2H7V1zm0 5V4h1v2zM6 8V7h1V6h1v2h1V7h5v1h-4v1H7V8zm0 0v1H2V8H1v1H0V7h3v1zm10 1h-1V7h1zm-1 0h-1v2h2v-1h-1zm-4 0h2v1h-1v1h-1zm2 3v-1h-1v1h-1v1H9v1h3v-2zm0 0h3v1h-2v1h-1zm-4-1v1h1v-2H7v1z"
              />
              <path d="M7 12h1v3h4v1H7zm9 2v2h-3v-1h2v-1z" />
            </g>
          </svg>
          <span>AuditQR</span>
        </a>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col page-offset">
      <div class="page-container-narrow pb-20">
        <header class="mb-6">
          <div class="step-indicator">
            <span class="step-indicator-label">Step 2 of 2</span>
            <div class="step-dots">
              <div class="step-dot completed"></div>
              <div class="step-dot active"></div>
            </div>
          </div>
          <h1 class="font-headline text-[26px] sm:text-[32px] md:text-[36px] font-medium text-white leading-tight mb-3">
            Set up your account
          </h1>
          <p class="font-body text-[15px] text-muted leading-relaxed">
            You'll use these credentials to log in and issue verifiable QR codes.
          </p>
        </header>

        <!-- Account Details Card -->
        <section
          class="bg-surface border border-outline-variant border-t-2 rounded-xl p-6 md:p-8 mb-8"
          style="border-top-color: #3185FC"
          id="account-details-card"
        >
          <div class="flex items-center gap-2 mb-8">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" class="text-blue text-[18px]" style="display:block;"><path d="M0 0h24v24H0z" fill="none"/><path fill="currentColor" d="M12 12q-1.65 0-2.825-1.175T8 8t1.175-2.825T12 4t2.825 1.175T16 8t-1.175 2.825T12 12m-8 8v-2.8q0-.85.438-1.562T5.6 14.55q1.55-.775 3.15-1.162T12 13t3.25.388t3.15 1.162q.725.375 1.163 1.088T20 17.2V20z"/></svg>
            <h2 class="font-body text-[17px] font-medium text-white">Account Details</h2>
          </div>
          <div class="space-y-6">
            <div>
              <label class="form-label" for="work-email">Work Email</label>
              <input
                class="w-full bg-surface-2 border border-border rounded-lg px-4 py-3 text-[14px] text-white placeholder-muted/50 focus:outline-none focus:border-blue focus:ring-1 focus:ring-blue/30 transition-colors font-body"
                placeholder="admin@yourbusiness.com"
                type="email"
                id="work-email"
                autocomplete="email"
              />
            </div>
            <div>
              <label class="form-label" for="password">Password</label>
              <div class="relative">
                <input
                  class="w-full bg-surface-2 border border-border rounded-lg px-4 py-3 pr-11 text-[14px] text-white placeholder-muted/50 focus:outline-none focus:border-blue focus:ring-1 focus:ring-blue/30 transition-colors font-body"
                  placeholder="Min. 8 characters"
                  type="password"
                  id="password"
                  autocomplete="new-password"
                />
                <button
                  type="button"
                  tabindex="-1"
                  id="toggle-password"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-blue transition-colors"
                >
                  <svg id="pw-eye-open" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" class="text-[20px]" style="display:block;"><path fill="currentColor" d="M15.188 14.688Q16.5 13.375 16.5 11.5t-1.312-3.187T12 7T8.813 8.313T7.5 11.5t1.313 3.188T12 16t3.188-1.312m-5.1-1.276Q9.3 12.625 9.3 11.5t.788-1.912T12 8.8t1.913.788t.787 1.912t-.787 1.913T12 14.2t-1.912-.787m-4.738 3.55Q2.35 14.925 1 11.5q1.35-3.425 4.35-5.462T12 4t6.65 2.038T23 11.5q-1.35 3.425-4.35 5.463T12 19t-6.65-2.037m11.838-1.45Q19.55 14.025 20.8 11.5q-1.25-2.525-3.613-4.012T12 6T6.813 7.488T3.2 11.5q1.25 2.525 3.613 4.013T12 17t5.188-1.487"/></svg>
                  <svg id="pw-eye-closed" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" class="text-[20px]" style="display:none;"><path fill="currentColor" d="m16.1 13.3l-1.45-1.45q.225-1.175-.675-2.2t-2.325-.8L10.2 7.4q.425-.2.863-.3T12 7q1.875 0 3.188 1.313T16.5 11.5q0 .5-.1.938t-.3.862m3.2 3.15l-1.45-1.4q.95-.725 1.688-1.587T20.8 11.5q-1.25-2.525-3.588-4.012T12 6q-.725 0-1.425.1T9.2 6.4L7.65 4.85q1.025-.425 2.1-.638T12 4q3.775 0 6.725 2.087T23 11.5q-.575 1.475-1.513 2.738T19.3 16.45m.5 6.15l-4.2-4.15q-.875.275-1.762.413T12 19q-3.775 0-6.725-2.087T1 11.5q.525-1.325 1.325-2.463T4.15 7L1.4 4.2l1.4-1.4l18.4 18.4zM5.55 8.4q-.725.65-1.325 1.425T3.2 11.5q1.25 2.525 3.588 4.013T12 17q.5 0 .975-.062t.975-.138l-.9-.95q-.275.075-.525.113T12 16q-1.875 0-3.188-1.312T7.5 11.5q0-.275.038-.525t.112-.525zm4.2 4.2"/></svg>
                </button>
              </div>
            </div>
            <div>
              <label class="form-label" for="confirm-password">Confirm Password</label>
              <div class="relative">
                <input
                  class="w-full bg-surface-2 border border-border rounded-lg px-4 py-3 pr-11 text-[14px] text-white placeholder-muted/50 focus:outline-none focus:border-blue focus:ring-1 focus:ring-blue/30 transition-colors font-body"
                  placeholder="Re-enter your password"
                  type="password"
                  id="confirm-password"
                  autocomplete="new-password"
                />
                <button
                  type="button"
                  tabindex="-1"
                  id="toggle-confirm-password"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-blue transition-colors"
                >
                  <svg id="cpw-eye-open" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" class="text-[20px]" style="display:block;"><path fill="currentColor" d="M15.188 14.688Q16.5 13.375 16.5 11.5t-1.312-3.187T12 7T8.813 8.313T7.5 11.5t1.313 3.188T12 16t3.188-1.312m-5.1-1.276Q9.3 12.625 9.3 11.5t.788-1.912T12 8.8t1.913.788t.787 1.912t-.787 1.913T12 14.2t-1.912-.787m-4.738 3.55Q2.35 14.925 1 11.5q1.35-3.425 4.35-5.462T12 4t6.65 2.038T23 11.5q-1.35 3.425-4.35 5.463T12 19t-6.65-2.037m11.838-1.45Q19.55 14.025 20.8 11.5q-1.25-2.525-3.613-4.012T12 6T6.813 7.488T3.2 11.5q1.25 2.525 3.613 4.013T12 17t5.188-1.487"/></svg>
                  <svg id="cpw-eye-closed" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" class="text-[20px]" style="display:none;"><path fill="currentColor" d="m16.1 13.3l-1.45-1.45q.225-1.175-.675-2.2t-2.325-.8L10.2 7.4q.425-.2.863-.3T12 7q1.875 0 3.188 1.313T16.5 11.5q0 .5-.1.938t-.3.862m3.2 3.15l-1.45-1.4q.95-.725 1.688-1.587T20.8 11.5q-1.25-2.525-3.588-4.012T12 6q-.725 0-1.425.1T9.2 6.4L7.65 4.85q1.025-.425 2.1-.638T12 4q3.775 0 6.725 2.087T23 11.5q-.575 1.475-1.513 2.738T19.3 16.45m.5 6.15l-4.2-4.15q-.875.275-1.762.413T12 19q-3.775 0-6.725-2.087T1 11.5q.525-1.325 1.325-2.463T4.15 7L1.4 4.2l1.4-1.4l18.4 18.4zM5.55 8.4q-.725.65-1.325 1.425T3.2 11.5q1.25 2.525 3.588 4.013T12 17q.5 0 .975-.062t.975-.138l-.9-.95q-.275.075-.525.113T12 16q-1.875 0-3.188-1.312T7.5 11.5q0-.275.038-.525t.112-.525zm4.2 4.2"/></svg>
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- Submit Actions -->
        <div class="space-y-4">
          <button
            class="w-full bg-blue hover:bg-blue-dark text-white py-[12px] rounded-lg font-body font-medium active:scale-[0.98] transition-all text-[14px]"
            id="submit-registration-btn"
            onclick="completeRegistration(event)"
          >
            Complete Registration
          </button>
        </div>
      </div>

      <!-- Email sent success screen (hidden until registration succeeds) -->
      <div class="flex-1 flex items-center justify-center hidden" id="email-sent-view">
        <div class="text-center px-6 max-w-sm">
          <div class="w-16 h-16 rounded-full bg-blue/10 border border-blue/30 flex items-center justify-center mx-auto mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" class="text-blue text-[32px]"><path d="M0 0h24v24H0z" fill="none"/><path fill="currentColor" d="m15.95 22l-4.25-4.25l1.4-1.4l2.85 2.85l5.65-5.65l1.4 1.4zM4 20q-.825 0-1.412-.587T2 18V6q0-.825.588-1.412T4 4h16q.825 0 1.413.588T22 6v4.35l-6.025 6.025L13.1 13.5l-4.225 4.225L11.15 20zm8-7l8-5V6l-8 5l-8-5v2z"/></svg>
          </div>
          <h1 class="font-headline text-[26px] font-medium text-white mb-3">Check your email</h1>
          <p class="font-body text-muted text-[15px]">We've sent a verification link to</p>
          <p class="font-body text-white text-[15px] font-medium mt-1" id="sent-email"></p>
          <p class="font-body text-muted text-[13px] mt-4">The link expires in 24 hours.</p>
        </div>
      </div>
    </main>

    <script>
      // Password visibility toggles
      function setupToggle(btnId, inputId, openId, closedId) {
        document.getElementById(btnId).addEventListener("click", () => {
          const input = document.getElementById(inputId);
          const showing = input.type === "password";
          input.type = showing ? "text" : "password";
          document.getElementById(openId).style.display = showing ? "none" : "block";
          document.getElementById(closedId).style.display = showing ? "block" : "none";
        });
      }
      setupToggle("toggle-password", "password", "pw-eye-open", "pw-eye-closed");
      setupToggle("toggle-confirm-password", "confirm-password", "cpw-eye-open", "cpw-eye-closed");

      async function completeRegistration(e) {
        e.preventDefault();
        const btn = document.getElementById("submit-registration-btn");
        btn.innerText = "Creating Account...";
        btn.disabled = true;

        try {
          const businessName = localStorage.getItem("businessName");
          const rcNumber = localStorage.getItem("rcNumber");
          if (!businessName || !rcNumber) {
            window.location.href = "register.html";
            return;
          }
          const email = document.getElementById("work-email").value;
          const password = document.getElementById("password").value;
          const confirmPassword = document.getElementById("confirm-password").value;

          if (!password || password.length < 8) {
            showToast("Password must be at least 8 characters.", "error");
            btn.innerText = "Complete Registration";
            btn.disabled = false;
            return;
          }
          if (password !== confirmPassword) {
            showToast("Passwords do not match.", "error");
            btn.innerText = "Complete Registration";
            btn.disabled = false;
            return;
          }

          const res = await apiFetch("/api/sme/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ businessName, rcNumber, email, password }),
          });

          const data = await res.json();
          if (res.ok) {
            document.querySelector("main > .page-container-narrow:first-child").classList.add("hidden");
            document.getElementById("email-sent-view").classList.remove("hidden");
            document.getElementById("sent-email").textContent = email;
          } else {
            showToast("Registration failed: " + (data.error || "Unknown error"), "error");
            btn.innerText = "Complete Registration";
            btn.disabled = false;
          }
        } catch (err) {
          showToast("Network error. Is the server running?", "error");
          btn.innerText = "Complete Registration";
          btn.disabled = false;
        }
      }
    </script>
  </body>
</html>
