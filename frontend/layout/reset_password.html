<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Reset Password | AuditQR</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#3185FC" />
    <link rel="stylesheet" href="../design-tokens.css" />
    <link rel="stylesheet" href="../tailwind.css" />
    <script src="../config.js"></script>
    <script src="/layout/toast.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen flex flex-col">
    <nav class="navbar">
      <div class="navbar-content">
        <a href="/" class="navbar-logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 16 16">
            <path d="M0 0h16v16H0z" fill="none" />
            <g fill="#3185FC">
              <path d="M2 2h2v2H2z" />
              <path d="M6 0v6H0V0zM5 1H1v4h4zM4 12H2v2h2z" />
              <path d="M6 10v6H0v-6zm-5 1v4h4v-4zm11-9h2v2h-2z" />
              <path d="M10 0v6h6V0zm5 1v4h-4V1zM8 1V0h1v2H8v2H7V1zm0 5V4h1v2zM6 8V7h1V6h1v2h1V7h5v1h-4v1H7V8zm0 0v1H2V8H1v1H0V7h3v1zm10 1h-1V7h1zm-1 0h-1v2h2v-1h-1zm-4 0h2v1h-1v1h-1zm2 3v-1h-1v1h-1v1H9v1h3v-2zm0 0h3v1h-2v1h-1zm-4-1v1h1v-2H7v1z" />
              <path d="M7 12h1v3h4v1H7zm9 2v2h-3v-1h2v-1z" />
            </g>
          </svg>
          <span>AuditQR</span>
        </a>
      </div>
    </nav>

    <main class="flex-1 page-offset pb-20 flex items-center justify-center">
      <div class="w-full max-w-md px-4">

        <!-- Invalid/missing token state (shown immediately if no token) -->
        <div id="invalid-view" class="hidden text-center py-8">
          <div class="w-16 h-16 rounded-full bg-blue/10 border border-blue/30 flex items-center justify-center mx-auto mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" class="text-blue text-[32px]"><path d="M0 0h24v24H0z" fill="none"/><path fill="currentColor" d="m19.25 16.45l-1.5-1.55q1-.275 1.625-1.063T20 12q0-1.25-.875-2.125T17 9h-4V7h4q2.075 0 3.538 1.463T22 12q0 1.425-.737 2.625T19.25 16.45M15.85 13l-2-2H16v2zm3.95 9.6L1.4 4.2l1.4-1.4l18.4 18.4zM11 17H7q-2.075 0-3.537-1.463T2 12q0-1.725 1.05-3.075t2.7-1.775L7.6 9H7q-1.25 0-2.125.875T4 12t.875 2.125T7 15h4zm-3-4v-2h1.625l1.975 2z"/></svg>
          </div>
          <h1 class="font-headline text-[26px] font-medium text-white mb-3">Invalid reset link</h1>
          <p class="font-body text-muted text-[15px] leading-relaxed max-w-sm mx-auto">
            This link is missing or invalid. Please request a new one.
          </p>
          <div class="mt-8">
            <a
              href="forgot_password.html"
              class="inline-block bg-blue hover:bg-blue-dark text-white font-body font-medium px-6 py-3 rounded-lg transition-all active:scale-[0.98] text-[14px]"
            >Request new link</a>
          </div>
        </div>

        <!-- Form view -->
        <div id="form-view" class="hidden">
          <header class="mb-8 text-center">
            <h1 class="font-headline text-[30px] font-medium text-white mb-3">Set new password</h1>
            <p class="font-body text-[15px] text-muted leading-relaxed">
              Choose a strong password for your account.
            </p>
          </header>

          <div class="bg-surface border border-outline-variant border-t-2 rounded-xl p-6 md:p-8" style="border-top-color:#3185fc">
            <form id="reset-form" class="space-y-5" novalidate>
              <div>
                <label class="form-label" for="new-password">New password</label>
                <div class="relative">
                  <input
                    class="w-full bg-surface-2 border border-border rounded-lg px-4 py-3 pr-11 text-[14px] text-white placeholder-muted/50 focus:outline-none focus:border-blue focus:ring-1 focus:ring-blue/30 transition-colors font-body"
                    type="password"
                    id="new-password"
                    placeholder="Min. 8 characters"
                    autocomplete="new-password"
                    required
                  />
                  <button type="button" tabindex="-1" id="toggle-new" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-blue transition-colors">
                    <svg id="new-eye-open" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" class="text-[20px]" style="display:block;"><path fill="currentColor" d="M15.188 14.688Q16.5 13.375 16.5 11.5t-1.312-3.187T12 7T8.813 8.313T7.5 11.5t1.313 3.188T12 16t3.188-1.312m-5.1-1.276Q9.3 12.625 9.3 11.5t.788-1.912T12 8.8t1.913.788t.787 1.912t-.787 1.913T12 14.2t-1.912-.787m-4.738 3.55Q2.35 14.925 1 11.5q1.35-3.425 4.35-5.462T12 4t6.65 2.038T23 11.5q-1.35 3.425-4.35 5.463T12 19t-6.65-2.037m11.838-1.45Q19.55 14.025 20.8 11.5q-1.25-2.525-3.613-4.012T12 6T6.813 7.488T3.2 11.5q1.25 2.525 3.613 4.013T12 17t5.188-1.487"/></svg>
                    <svg id="new-eye-closed" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" class="text-[20px]" style="display:none;"><path fill="currentColor" d="m16.1 13.3l-1.45-1.45q.225-1.175-.675-2.2t-2.325-.8L10.2 7.4q.425-.2.863-.3T12 7q1.875 0 3.188 1.313T16.5 11.5q0 .5-.1.938t-.3.862m3.2 3.15l-1.45-1.4q.95-.725 1.688-1.587T20.8 11.5q-1.25-2.525-3.588-4.012T12 6q-.725 0-1.425.1T9.2 6.4L7.65 4.85q1.025-.425 2.1-.638T12 4q3.775 0 6.725 2.087T23 11.5q-.575 1.475-1.513 2.738T19.3 16.45m.5 6.15l-4.2-4.15q-.875.275-1.762.413T12 19q-3.775 0-6.725-2.087T1 11.5q.525-1.325 1.325-2.463T4.15 7L1.4 4.2l1.4-1.4l18.4 18.4zM5.55 8.4q-.725.65-1.325 1.425T3.2 11.5q1.25 2.525 3.588 4.013T12 17q.5 0 .975-.062t.975-.138l-.9-.95q-.275.075-.525.113T12 16q-1.875 0-3.188-1.312T7.5 11.5q0-.275.038-.525t.112-.525zm4.2 4.2"/></svg>
                  </button>
                </div>
              </div>
              <div>
                <label class="form-label" for="confirm-password">Confirm password</label>
                <div class="relative">
                  <input
                    class="w-full bg-surface-2 border border-border rounded-lg px-4 py-3 pr-11 text-[14px] text-white placeholder-muted/50 focus:outline-none focus:border-blue focus:ring-1 focus:ring-blue/30 transition-colors font-body"
                    type="password"
                    id="confirm-password"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                    required
                  />
                  <button type="button" tabindex="-1" id="toggle-confirm" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-blue transition-colors">
                    <svg id="confirm-eye-open" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" class="text-[20px]" style="display:block;"><path fill="currentColor" d="M15.188 14.688Q16.5 13.375 16.5 11.5t-1.312-3.187T12 7T8.813 8.313T7.5 11.5t1.313 3.188T12 16t3.188-1.312m-5.1-1.276Q9.3 12.625 9.3 11.5t.788-1.912T12 8.8t1.913.788t.787 1.912t-.787 1.913T12 14.2t-1.912-.787m-4.738 3.55Q2.35 14.925 1 11.5q1.35-3.425 4.35-5.462T12 4t6.65 2.038T23 11.5q-1.35 3.425-4.35 5.463T12 19t-6.65-2.037m11.838-1.45Q19.55 14.025 20.8 11.5q-1.25-2.525-3.613-4.012T12 6T6.813 7.488T3.2 11.5q1.25 2.525 3.613 4.013T12 17t5.188-1.487"/></svg>
                    <svg id="confirm-eye-closed" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" class="text-[20px]" style="display:none;"><path fill="currentColor" d="m16.1 13.3l-1.45-1.45q.225-1.175-.675-2.2t-2.325-.8L10.2 7.4q.425-.2.863-.3T12 7q1.875 0 3.188 1.313T16.5 11.5q0 .5-.1.938t-.3.862m3.2 3.15l-1.45-1.4q.95-.725 1.688-1.587T20.8 11.5q-1.25-2.525-3.588-4.012T12 6q-.725 0-1.425.1T9.2 6.4L7.65 4.85q1.025-.425 2.1-.638T12 4q3.775 0 6.725 2.087T23 11.5q-.575 1.475-1.513 2.738T19.3 16.45m.5 6.15l-4.2-4.15q-.875.275-1.762.413T12 19q-3.775 0-6.725-2.087T1 11.5q.525-1.325 1.325-2.463T4.15 7L1.4 4.2l1.4-1.4l18.4 18.4zM5.55 8.4q-.725.65-1.325 1.425T3.2 11.5q1.25 2.525 3.588 4.013T12 17q.5 0 .975-.062t.975-.138l-.9-.95q-.275.075-.525.113T12 16q-1.875 0-3.188-1.312T7.5 11.5q0-.275.038-.525t.112-.525zm4.2 4.2"/></svg>
                  </button>
                </div>
              </div>
              <button
                type="submit"
                id="reset-btn"
                class="w-full bg-blue hover:bg-blue-dark text-white font-body font-medium py-3.5 rounded-lg flex justify-center items-center gap-2 transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed"
              >
                <span id="reset-btn-text">Save new password</span>
              </button>
            </form>
          </div>

          <p class="text-center text-[13px] text-muted mt-6">
            <a href="login.html" class="text-blue hover:underline">Back to login</a>
          </p>
        </div>

        <!-- Success view -->
        <div id="success-view" class="hidden text-center py-8">
          <div class="w-16 h-16 rounded-full bg-blue/10 border border-blue/30 flex items-center justify-center mx-auto mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" class="text-blue text-[32px]"><path d="M0 0h24v24H0z" fill="none"/><path fill="currentColor" d="M12 22q-2.075 0-3.9-.788t-3.175-2.137T2.788 15.9T2 12h2q0 1.65.625 3.113t1.713 2.55t2.55 1.725t3.112.637q3.35 0 5.675-2.325T20 12.025T17.675 6.35T12 4.025q-2.225 0-4.038 1.088T5.1 8H8v2H2V4h2v2q1.375-1.825 3.45-2.912T12 2q2.075 0 3.9.788t3.175 2.137T21.213 8.1T22 12t-.788 3.9t-2.137 3.175t-3.175 2.138T12 22m-2-6q-.425 0-.712-.288T9 15v-3q0-.425.288-.712T10 11v-1q0-.825.588-1.412T12 8t1.413.588T14 10v1q.425 0 .713.288T15 12v3q0 .425-.288.713T14 16zm1-5h2v-1q0-.425-.288-.712T12 9t-.712.288T11 10z"/></svg>
          </div>
          <h1 class="font-headline text-[26px] font-medium text-white mb-3">Password updated</h1>
          <p class="font-body text-muted text-[15px] leading-relaxed max-w-sm mx-auto">
            Your password has been changed. You can now sign in with your new password.
          </p>
          <div class="mt-8">
            <a
              href="login.html"
              class="inline-block bg-blue hover:bg-blue-dark text-white font-body font-medium px-6 py-3 rounded-lg transition-all active:scale-[0.98] text-[14px]"
            >Go to login</a>
          </div>
        </div>

      </div>
    </main>

    <div class="glow-blue-center"></div>

    <script>
      const token = new URLSearchParams(window.location.search).get("token");

      if (!token) {
        document.getElementById("invalid-view").classList.remove("hidden");
      } else {
        document.getElementById("form-view").classList.remove("hidden");
      }

      function setupToggle(btnId, inputId, openId, closedId) {
        document.getElementById(btnId).addEventListener("click", function () {
          const input = document.getElementById(inputId);
          const showing = input.type === "password";
          input.type = showing ? "text" : "password";
          document.getElementById(openId).style.display = showing ? "none" : "block";
          document.getElementById(closedId).style.display = showing ? "block" : "none";
        });
      }
      setupToggle("toggle-new", "new-password", "new-eye-open", "new-eye-closed");
      setupToggle("toggle-confirm", "confirm-password", "confirm-eye-open", "confirm-eye-closed");

      document.getElementById("reset-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        const newPassword = document.getElementById("new-password").value;
        const confirmPassword = document.getElementById("confirm-password").value;
        const btn = document.getElementById("reset-btn");
        const btnText = document.getElementById("reset-btn-text");

        if (!newPassword || newPassword.length < 8) {
          showToast("Password must be at least 8 characters.", "error");
          return;
        }
        if (newPassword !== confirmPassword) {
          showToast("Passwords do not match.", "error");
          return;
        }

        btn.disabled = true;
        btnText.textContent = "Saving…";

        try {
          const res = await fetch(API_BASE + "/api/sme/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, newPassword }),
          });
          const data = await res.json();

          if (res.ok) {
            document.getElementById("form-view").classList.add("hidden");
            document.getElementById("success-view").classList.remove("hidden");
          } else {
            showToast(data.error || "Link expired or already used. Request a new one.", "error");
            btn.disabled = false;
            btnText.textContent = "Save new password";
          }
        } catch (err) {
          showToast("Network error. Is the server running?", "error");
          btn.disabled = false;
          btnText.textContent = "Save new password";
        }
      });
    </script>
  </body>
</html>
