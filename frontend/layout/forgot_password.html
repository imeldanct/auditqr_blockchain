<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Forgot Password | AuditQR</title>
    <link rel="stylesheet" href="../design-tokens.css" />
    <link rel="stylesheet" href="../tailwind.css" />
    <script src="../config.js"></script>
    <script src="./toast.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen flex flex-col">
    <nav class="navbar">
      <div class="navbar-content">
        <a href="landing.html" class="navbar-logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 16 16">
            <path d="M0 0h16v16H0z" fill="none" />
            <g fill="#3185FC">
              <path d="M2 2h2v2H2z" />
              <path d="M6 0v6H0V0zM5 1H1v4h4zM4 12H2v2h2z" />
              <path d="M6 10v6H0v-6zm-5 1v4h4v-4zm11-9h2v2h-2z" />
              <path d="M10 0v6h6V0zm5 1v4h-4V1zM8 1V0h1v2H8v2H7V1zm0 5V4h1v2zM6 8V7h1V6h1v2h1V7h5v1h-4v1H7V8zm0 0v1H2V8H1v1H0V7h3v1zm10 1h-1V7h1zm-1 0h-1v2h2v-1h-1zm-4 0h2v1h-1v1h-1zm2 3v-1h-1v1h-1v1H9v1h3v-2zm0 0h3v1h-2v1h-1zm-4-1v1h1v-2H7v1z" />
              <path d="M7 12h1v3h4v1H7zm9 2v2h-3v-1h2v-1z" />
            </g>
          </svg>
          <span>AuditQR</span>
        </a>
      </div>
    </nav>

    <main class="flex-1 page-offset pb-20 flex items-center justify-center">
      <div class="w-full max-w-md px-4">

        <!-- Form view -->
        <div id="form-view">
          <header class="mb-8 text-center">
            <h1 class="font-headline text-[30px] font-medium text-white mb-3">Forgot password?</h1>
            <p class="font-body text-[15px] text-muted leading-relaxed">
              Enter the email address on your account and we'll send you a reset link.
            </p>
          </header>

          <div class="bg-surface border border-outline-variant border-t-2 rounded-xl p-6 md:p-8" style="border-top-color:#3185fc">
            <form id="forgot-form" class="space-y-5" novalidate>
              <div>
                <label class="form-label" for="forgot-email">Email address</label>
                <input
                  class="w-full bg-surface-2 border border-border rounded-lg px-4 py-3 text-[14px] text-white placeholder-muted/50 focus:outline-none focus:border-blue focus:ring-1 focus:ring-blue/30 transition-colors font-body"
                  type="email"
                  id="forgot-email"
                  placeholder="admin@yourbusiness.com"
                  autocomplete="email"
                  required
                />
              </div>
              <button
                type="submit"
                id="forgot-btn"
                class="w-full bg-blue hover:bg-blue-dark text-white font-body font-medium py-3.5 rounded-lg flex justify-center items-center gap-2 transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed"
              >
                <span id="forgot-btn-text">Send reset link</span>
              </button>
            </form>
          </div>

          <p class="text-center text-[13px] text-muted mt-6">
            <a href="login.html" class="text-blue hover:underline">Back to login</a>
          </p>
        </div>

        <!-- Success view -->
        <div id="success-view" class="hidden text-center py-8">
          <div class="w-16 h-16 rounded-full bg-blue/10 border border-blue/30 flex items-center justify-center mx-auto mb-6">
            <span class="material-symbols-outlined text-blue text-[32px]" style="font-variation-settings:'FILL' 1">mark_email_read</span>
          </div>
          <h1 class="font-headline text-[26px] font-medium text-white mb-3">Check your email</h1>
          <p class="font-body text-muted text-[15px] leading-relaxed max-w-sm mx-auto">
            If an account exists for that email, we've sent a password reset link. It expires in 1 hour.
          </p>
          <p class="font-body text-muted text-[13px] mt-6">
            <a href="login.html" class="text-blue hover:underline">Back to login</a>
          </p>
        </div>

      </div>
    </main>

    <div class="glow-blue-center"></div>

    <script>
      document.getElementById("forgot-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        const email = document.getElementById("forgot-email").value.trim();
        const btn = document.getElementById("forgot-btn");
        const btnText = document.getElementById("forgot-btn-text");

        if (!email) { showToast("Please enter your email address.", "error"); return; }

        btn.disabled = true;
        btnText.textContent = "Sending…";

        try {
          await fetch(API_BASE + "/api/sme/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });
          document.getElementById("form-view").classList.add("hidden");
          document.getElementById("success-view").classList.remove("hidden");
        } catch (err) {
          showToast("Network error. Is the server running?", "error");
          btn.disabled = false;
          btnText.textContent = "Send reset link";
        }
      });
    </script>
  </body>
</html>
